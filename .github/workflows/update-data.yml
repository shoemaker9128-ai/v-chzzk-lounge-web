name: Update live data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Chzzk lives
        run: python scripts/fetch_data.py

      - name: Commit if changed
        run: |
          git config user.name "v-chzzk-bot"
          git config user.email "actions@github.com"
          git add data/lives.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update live data"
            git push
          fi
